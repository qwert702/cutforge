name: Bug 报告
description: 报告 CutForge 的缺陷
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: 发生了什么?
      description: 期望行为与实际行为。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开 …
        2. 点击 …
        3. 出现 …
    validations:
      required: true
  - type: dropdown
    id: env-browser
    attributes:
      label: 使用环境
      options:
        - 在线版(GitHub Pages)
        - Windows 桌面版
        - 本地 dev 运行
    validations:
      required: true
  - type: input
    id: env-version
    attributes:
      label: 浏览器 / 系统版本
      placeholder: 例如 Chrome 140 / Windows 11
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 控制台报错(F12)
      placeholder: 有则粘贴,无则留空
