name: 功能建议
description: 提议新功能或改进
labels: [enhancement]
body:
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 你想完成什么?现在的工作流卡在哪?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 可以是描述,也可以是参考产品的做法。
    validations:
      required: true
  - type: checkboxes
    id: willingness
    attributes:
      label: 意愿
      options:
        - label: 我愿意参与实现或讨论设计
